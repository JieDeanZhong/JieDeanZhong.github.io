<g data-name="Typography">
<text x="54" y="635" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="13" fill="#1D1D1F">一手参考 / PRINCIPLES, NOT TEMPLATES</text>
<text x="54" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#1D1D1F">1  Paul Rand · Logos, Flags, and Escutcheons (1991)</text>
<text x="54" y="695" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="12" fill="#686E6A">识别优先；单色、可见性、可复用。</text>
<text x="54" y="715" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="8.3" fill="#686E6A">paulrand.design/writing/articles/1991-logos-flags-and-escutcheons.html</text>
<text x="54" y="736" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#1D1D1F">2  Google Design · Evolving the Google Identity</text>
<text x="54" y="759" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="12" fill="#686E6A">小尺寸单独调整重量与光学比例。</text>
<text x="54" y="779" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="8.3" fill="#686E6A">design.google/library/evolving-google-identity</text>
<text x="54" y="800" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#1D1D1F">3  Pentagram · MIT Media Lab</text>
<text x="54" y="823" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="12" fill="#686E6A">共同构件可以形成稳定而灵活的系统。</text>
<text x="54" y="843" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="8.3" fill="#686E6A">pentagram.com/work/mit-media-lab</text>
<text x="54" y="864" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#1D1D1F">4  Monotype · Tencent global identity</text>
<text x="54" y="887" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="12" fill="#686E6A">不同文字保留结构，以重量和笔画气质协调。</text>
<text x="54" y="907" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="8.3" fill="#686E6A">enterprise.monotype.com/resources/case-studies/tencent-expands-global-presence</text>
<text x="784" y="672" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#1D1D1F">5  Monotype · Quentin Blake handwriting</text>
<text x="784" y="695" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="12" fill="#686E6A">手写个性来自有规律的不规则与实际笔迹。</text>
<text x="784" y="715" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="8.3" fill="#686E6A">monotype.com/resources/case-studies/a-bespoke-handwriting-typeface-for-sir-quentin-blake</text>
<text x="784" y="736" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#1D1D1F">6  Nielsen Norman Group · Homepage Links</text>
<text x="784" y="759" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="12" fill="#686E6A">左上角归属标识与明确的返回首页入口。</text>
<text x="784" y="779" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="8.3" fill="#686E6A">nngroup.com/articles/homepage-links/</text>
<text x="784" y="800" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#1D1D1F">7  W3C WAI · Functional Images</text>
<text x="784" y="823" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="12" fill="#686E6A">功能图像的文字替代应描述用途或目的地。</text>
<text x="784" y="843" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="8.3" fill="#686E6A">w3.org/WAI/tutorials/images/functional/</text>
</g>
