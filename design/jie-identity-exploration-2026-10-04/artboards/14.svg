<text x="56" y="163" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="15" fill="#686E6A">以下是设计判断，不是用户研究结果。所有“分岔、生命、可能性”均为造型隐喻，不是汉字字源解释。</text>
</g>
