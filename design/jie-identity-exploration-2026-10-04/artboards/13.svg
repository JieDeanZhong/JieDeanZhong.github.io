<text x="54" y="125" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="35" fill="#1D1D1F">让构件去变化，让主标保持稳定</text>
<text x="56" y="163" font-family="Arial Unicode MS, Hiragino Sans GB, sans-serif" font-weight="400" font-size="15" fill="#686E6A">以 02 为例：四点可成为节律，横竖与斜画可成为版面图形。它们不必被固定解释成四个研究方向。</text>
</g>
